# Default secretspec manifest for vaultwarden-mcp.
#
# This file is loaded by `vaultwarden-mcp` when a config field uses
# `secret://...` URIs. Override location with SECRETSPEC_MANIFEST=<path>.
# Override the provider with --secretspec-provider <uri> or
# SECRETSPEC_PROVIDER=<uri>. Common providers:
#
#   env               — read from environment variables
#   dotenv:/path      — read from a .env file
#   keyring           — read from OS keyring (Keychain/credential manager)
#   onepassword       — read from 1Password
#
# Reference these in vaultwarden-mcp.toml via:
#   password = "secret://VAULTWARDEN_PASSWORD"
#   client_secret = "secret://VAULTWARDEN_CLIENT_SECRET"
#
# Per-account references can be namespaced, e.g.:
#   secret://VAULTWARDEN_PERSONAL_PASSWORD
#   secret://VAULTWARDEN_WORK_CLIENT_SECRET

[profiles.default]
VAULTWARDEN_PASSWORD = { description = "Vault master password" }
VAULTWARDEN_CLIENT_SECRET = { description = "Bitwarden OAuth client secret" }
