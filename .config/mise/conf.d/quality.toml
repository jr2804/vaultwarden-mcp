[tasks.test]
description = "Run Python tests (FastMCP client for the Rust MCP server)"
run = "cargo build --manifest-path native/Cargo.toml && uv run pytest --cov=vaultwarden_mcp"
sources = ["src/**/*.py", "tests/**/*.py"]
outputs = ["htmlcov/", ".coverage"]

[tasks.all]
description = "Run all quality checks"
depends = [
  "test",
  "lint",
  "spell",
  "format",
  "format-md",
  "docs",
]

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov docs/_build"]
