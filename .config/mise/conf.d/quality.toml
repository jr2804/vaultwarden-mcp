[tasks.test]
description = "Run Rust tests (Tier 1+2 crypto/integration) and Python structural tests"
run = [
  "cargo test --manifest-path native/Cargo.toml",
  "uv run pytest",
]
sources = ["native/src/**/*.rs", "native/tests/**/*.rs", "tests/**/*.py"]
outputs = [".coverage"]

[tasks.all]
description = "Run all quality checks"
depends = [
  "test",
  "lint",
  "spell",
  "format",
  "format-md",
  "docs",
]

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov docs/_build"]
