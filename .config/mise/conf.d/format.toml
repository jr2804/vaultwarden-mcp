[tasks.format]
description = "Format code (cargo fmt, ruff, isort, undersort)"
run = [
	"cargo fmt --manifest-path native/Cargo.toml",
	"undersort src tests",
	"ruff format src tests",
	"ruff check src tests --select I --fix",
]

[tasks.format-md]
description = "Lint and reformat Markdown files with rumdl"
run = "rumdl fmt --config .config/rumdl.toml src/ docs/ tests/ ./"
