# mise configuration
# Task definitions are in conf.d/*.toml files (automatically loaded by mise)
[tools]
# basic frameworks that should always be available
node = "latest"
bun = "latest"

# Rust toolchain for native server binary
rust = "1.97"

# C toolchain fallback for the native crate: `zig cc`/`zig ar` are used by
# native/scripts/{cc,cxx,ar,ranlib} when no system C compiler is installed.
# Pinned here so a clean clone builds with only `mise install` (no global zig).
zig = "0.13.0"

# Linter/formatter/type checker tools
"ruff" = "latest"
"ty" = "latest"
"rumdl" = "latest"
"pipx:undersort" = "latest"
"pipx:codespell" = "latest"

# CLI tools rg and tree-cli -> use `rg --files | tree-cli --fromfile` to get a nice tree view of the project files
ripgrep = "latest"
"github:peteretelej/tree" = { version = "latest", rename_exe = "tree-cli" }

# github CLI to get latest release of vaultwarden for integration tests
"github:cli/cli" = "latest"


[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true