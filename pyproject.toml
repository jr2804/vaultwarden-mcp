# pyproject.toml — Vaultwarden MCP (Python testing layer)
#
# The MCP server is implemented entirely in Rust (see native/Cargo.toml).
# This Python project provides the FastMCP-based test client suite that
# connects to the Rust binary's stdio/HTTP transport for black-box testing.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultwarden-mcp"
version = "2026.8.0"
description = "MCP server for Vaultwarden — Python test client (FastMCP)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Jan Reimes", email = "openclaw@reimes.ws" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "zensical>=0.0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=vaultwarden_mcp --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 80

[tool.ruff]
target-version = "py313"
line-length = 88
