[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "vaultwarden-mcp"
dynamic = ["version"]
description = "MCP server for accessing Vaultwarden servers with multi-account support"
requires-python = ">=3.13"
authors = [
    { name = "Hermes", email = "openclaw@reimes.ws" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "mcp>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[project.scripts]
vaultwarden-mcp = "vaultwarden_mcp.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.maturin]
python-source = "src"
module-name = "vaultwarden_mcp._native"
manifest-path = "native/Cargo.toml"
features = ["pyo3/extension-module"]
include = ["src/vaultwarden_mcp/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=vaultwarden_mcp --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 80
