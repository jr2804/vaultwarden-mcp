# pyproject.toml — Vaultwarden MCP (Python scripting environment)
#
# The MCP server is implemented entirely in Rust (see native/Cargo.toml).
# Python here is a scripting environment for testing, debugging, and docs tooling
# (pytest structural checks, ruff, zensical). There is no Python package to install.

[project]
name = "vaultwarden-mcp-scripts"
version = "2026.8.0"
description = "Scripting environment for the Rust vaultwarden-mcp server (tests, docs, tooling)"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Jan Reimes", email = "jan.reimes@reimes.ws" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "zensical>=0.0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 88
