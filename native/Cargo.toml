[package]
name = "vaultwarden-mcp"
version = "2026.8.5"
edition = "2024"
rust-version = "1.88"
description = "MCP server for Vaultwarden (Bitwarden-compatible password manager) — search, read, and manage vault entries via the Model Context Protocol"
license = "MIT"
authors = ["Hermes Agent <openclaw@reimes.ws>"]

[features]
default = ["http"]
http = ["rmcp/transport-streamable-http-server", "dep:axum", "dep:tower"]

[dependencies]
vaultwarden-cli = { git = "https://github.com/haydonryan/vaultwarden-cli.git", rev = "96cdd0dfc04d04223ec88f8ab0dd217dc0e9beb8" }
rmcp = { version = "3", features = ["schemars", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = { version = "1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config file support (SPEC: .agents/plans/01-config.md)
# secretspec integration is scaffolded; the crate is not yet wired because the
# 0.2.x → 0.18.x line is mid-migration and the public surface is unstable.
# See doc comments in config.rs for the planned hookup.
toml = "0.8"

# Optional: streamable HTTP transport
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }

# Write path: cipher create/edit/delete endpoints + field encryption.
# The vaultwarden-cli ApiClient only implements read endpoints, so writes go
# through our own reqwest client. rand provides the per-field AES IV.
# aes/cbc/hmac/sha2/base64 implement the Bitwarden symmetric cipher envelope
# (CryptoKeys exposes decrypt but not encrypt, so we implement the matching
# encrypt here).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rand = "0.10"
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
secretspec = { version = "0.18", default-features = false, features = ["cli", "keyring", "bw", "age", "kdbx"] }

[dev-dependencies]
tempfile = "3.27.0"
# Crypto fixture builder for integration tests — mirrors vaultwarden-cli's
# internal test_helpers::encrypt_bytes_for_test (AES-256-CBC + HMAC-SHA256).
# Production encrypt now uses the same crates as regular dependencies; these
# dev-deps remain so the test fixture (fixed-IV variant) can keep using them.
wiremock = "0.6"

[profile.release]
strip = "symbols"
codegen-units = 1

[[bin]]
name = "vaultwarden-mcp"
path = "src/main.rs"
