name: Release

on:
  push:
    tags: ["2026.*"]  # CalVer version tags trigger releases (e.g. 2026.8.0)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: vaultwarden-mcp-linux-x86_64
            binary_name: vaultwarden-mcp

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact_name: vaultwarden-mcp-linux-aarch64
            binary_name: vaultwarden-mcp

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name: vaultwarden-mcp-windows-x86_64
            binary_name: vaultwarden-mcp.exe

          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: vaultwarden-mcp-macos-aarch64
            binary_name: vaultwarden-mcp

          - target: x86_64-apple-darwin
            runner: macos-13
            artifact_name: vaultwarden-mcp-macos-x86_64
            binary_name: vaultwarden-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ matrix.runner }}-${{ matrix.target }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: native

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip native/target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: native/target/${{ matrix.target }}/release/${{ matrix.binary_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## vaultwarden-mcp ${{ github.ref_name }}

            Prebuilt binaries for all platforms. Download the binary for your OS/architecture.

            ### Quick start
            ```bash
            # Download and make executable (Linux/macOS)
            chmod +x vaultwarden-mcp

            # Run as MCP server (stdio transport)
            export VAULTWARDEN_SERVER=https://your-vault.example.com
            export VAULTWARDEN_CLIENT_ID="your-client-id"
            export VAULTWARDEN_CLIENT_SECRET="your-client-secret"
            export VAULTWARDEN_PASSWORD="your-vault-password"

            ./vaultwarden-mcp serve --transport stdio
            ```
          files: |
            artifacts/vaultwarden-mcp-linux-x86_64/vaultwarden-mcp
            artifacts/vaultwarden-mcp-linux-aarch64/vaultwarden-mcp
            artifacts/vaultwarden-mcp-windows-x86_64/vaultwarden-mcp.exe
            artifacts/vaultwarden-mcp-macos-aarch64/vaultwarden-mcp
            artifacts/vaultwarden-mcp-macos-x86_64/vaultwarden-mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
