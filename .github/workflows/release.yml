name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency: release

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: x86_64-pc-windows-msvc
            runner: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets:
            - ${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install maturin
        run: uv tool install maturin

      - name: Build release wheel
        run: maturin build --interpreter python --release --out ./dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Create Release
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect wheels
        run: |
          mkdir -p release_artifacts
          find downloaded -name '*.whl' -exec cp -v {} release_artifacts/ \;
          ls -la release_artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.release.tag_name }}
          name: Release ${{ github.ref_name || github.event.release.tag_name }}
          generate_release_notes: true
          files: release_artifacts/*.whl